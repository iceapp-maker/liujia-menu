<!-- [Section 1: 網頁宣告與資源引用] Start -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>櫃台 POS 與後台管理系統</title>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
<!-- [Section 1: 網頁宣告與資源引用] End -->

<!-- [Section 2: CSS 樣式設定] Start -->
  <style>
    :root {
      --primary: #d32f2f;
      --dark: #1e293b;
      --bg: #f1f5f9;
      --card: #ffffff;
      --green: #2e7d32;
      --blue: #1565c0;
      --orange: #ef6c00;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: #1e293b;
    }
    /* 登入畫面 */
    #loginScreen {
      position: fixed; inset: 0;
      background: var(--dark);
      display: flex; align-items: center; justify-content: center;
      z-index: 2000;
    }
    .login-box {
      background: white; padding: 30px; border-radius: 16px;
      width: 90%; max-width: 360px; text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .pin-input {
      width: 100%; padding: 12px; font-size: 22px; text-align: center;
      letter-spacing: 8px; border: 2px solid #cbd5e1; border-radius: 10px;
      margin: 16px 0;
    }
    .btn-login {
      width: 100%; padding: 13px; background: var(--primary); color: white;
      border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer;
    }

    /* 頂部導覽 */
    .navbar {
      background: var(--dark); color: white;
      padding: 14px 20px; display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
    }
    .nav-tabs {
      display: flex; background: white; border-bottom: 1px solid #e2e8f0;
      overflow-x: auto; padding: 0 16px;
    }
    .tab {
      padding: 14px 18px; font-size: 15px; font-weight: 700; color: #64748b;
      border: none; background: none; border-bottom: 3px solid transparent;
      cursor: pointer; white-space: nowrap;
    }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    .content-section { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .content-section.active { display: block; }

    /* 訂單卡片網格 */
    .orders-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px;
    }
    .order-card {
      background: white; border-radius: 14px; padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 6px solid var(--orange);
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .order-card.completed { border-left-color: var(--blue); }
    .order-card.paid { border-left-color: var(--green); }

    .btn {
      padding: 8px 12px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .btn-green { background: var(--green); color: white; }
    .btn-blue { background: var(--blue); color: white; }
    .btn-red { background: #fee2e2; color: #b91c1c; }
    .btn-gray { background: #e2e8f0; color: #334155; }

    /* 彈窗與 Toast */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(15,23,42,0.92); color: white; padding: 12px 22px;
      border-radius: 30px; font-size: 14px; font-weight: bold;
      display: none; z-index: 3000;
    }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center; z-index: 2500; padding: 16px;
    }
    .modal-card {
      background: white; border-radius: 14px; padding: 22px;
      width: 100%; max-width: 460px; max-height: 85vh; overflow-y: auto;
    }
    .form-input {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1;
      border-radius: 8px; font-size: 14px; margin-top: 4px; margin-bottom: 12px;
    }
  </style>
<!-- [Section 2: CSS 樣式設定] End -->
</head>
<body>

<!-- [Section 3: HTML 共用元件與彈窗] Start -->
  <div id="toast">提示訊息</div>

  <!-- 自訂 Confirm 彈窗 -->
  <div id="confirmModal" class="modal-overlay">
    <div class="modal-card" style="max-width: 380px; text-align: center;">
      <h3 style="margin-bottom: 12px;">系統確認</h3>
      <p id="confirmMessage" style="color: #475569; font-size: 14px; white-space: pre-line; margin-bottom: 20px;"></p>
      <div style="display: flex; gap: 10px; justify-content: center;">
        <button class="btn btn-gray" style="flex:1; padding:10px;" onclick="closeConfirm(false)">取消</button>
        <button class="btn btn-green" style="flex:1; padding:10px;" onclick="closeConfirm(true)">確定</button>
      </div>
    </div>
  </div>

  <!-- 換桌彈窗 -->
  <div id="changeTableModal" class="modal-overlay">
    <div class="modal-card" style="max-width: 380px;">
      <h3 style="margin-bottom: 12px;">🔄 更換桌位</h3>
      <select id="posTableSelect" class="form-input"></select>
      <div style="display: flex; gap: 10px; margin-top: 10px;">
        <button class="btn btn-gray" style="flex:1;" onclick="closeChangeTableModal()">取消</button>
        <button class="btn btn-blue" style="flex:1;" onclick="confirmChangeTable()">確認換桌</button>
      </div>
    </div>
  </div>

  <!-- 方案 C：智慧勾選合併/分開結帳 Modal -->
  <div id="checkoutModal" class="modal-overlay">
    <div class="modal-card">
      <h3 id="checkoutModalTitle" style="margin-bottom: 8px; font-size: 18px;">💰 桌位結帳確認</h3>
      <p style="font-size: 13px; color: #64748b; margin-bottom: 12px;">可自由勾選本次要結清的單據（預設勾選主單與親友加單）：</p>
      <div id="checkoutOrdersList" style="margin-bottom: 16px;"></div>
      <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:#f8fafc; border-radius:10px; margin-bottom:16px;">
        <span style="font-weight:bold;">勾選應收總計：</span>
        <strong id="checkoutSelectedTotal" style="font-size:22px; color:var(--primary);">$0</strong>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-gray" style="flex:1; padding:12px;" onclick="closeCheckoutModal()">取消</button>
        <button class="btn btn-green" style="flex:2; padding:12px;" onclick="confirmBatchCheckout()">✅ 確認收款結帳</button>
      </div>
    </div>
  </div>
<!-- [Section 3: HTML 共用元件與彈窗] End -->

<!-- [Section 4: HTML 登入畫面] Start -->
  <div id="loginScreen">
    <div class="login-box">
      <h2 style="margin-bottom: 6px;">🔒 店家後台管理</h2>
      <p style="font-size: 13px; color: #64748b;">請輸入 4 位數管理密碼 (預設 1111)</p>
      <input type="password" id="pinInput" class="pin-input" maxlength="8" placeholder="••••">
      <button class="btn-login" onclick="verifyPin()">登入系統</button>
    </div>
  </div>
<!-- [Section 4: HTML 登入畫面] End -->

<!-- [Section 5: HTML 後台主介面與版面配置] Start -->
  <div id="adminDashboard" style="display: none;">
    <nav class="navbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <h2 style="font-size: 19px;" id="adminHeaderTitle">🍜 櫃台接單與 POS 系統</h2>
      </div>
      <button onclick="triggerReset()" class="btn" style="background:#ef4444; color:white;">🔄 每日號碼歸零與清桌</button>
    </nav>

    <div class="nav-tabs">
      <button class="tab active" onclick="switchTab('ordersTab', this)">📋 即時接單與桌況</button>
      <button class="tab" onclick="switchTab('historyTab', this)">🕒 今日已結帳歷史</button>
      <button class="tab" onclick="switchTab('reportTab', this)">📊 營運報表與熱銷排行</button>
      <button class="tab" onclick="switchTab('menuTab', this)">🍱 菜單售完開關</button>
      <button class="tab" onclick="switchTab('settingsTab', this)">⚙️ 店務與桌位設定</button>
    </div>

    <!-- 分頁 1: 即時訂單 -->
    <div id="ordersTab" class="content-section active">
      <h3 style="margin-bottom: 12px; color:#c2410c;">🔥 廚房待製作 (Pending)</h3>
      <div id="pendingOrdersGrid" class="orders-grid" style="margin-bottom: 28px;"></div>

      <h3 style="margin-bottom: 12px; color:#1565c0;">🍽️ 已出餐・用餐待結帳 (Completed)</h3>
      <div id="completedOrdersGrid" class="orders-grid"></div>
    </div>

    <!-- 分頁 2: 歷史紀錄 -->
    <div id="historyTab" class="content-section">
      <h3 style="margin-bottom: 14px;">✅ 已完成結帳歸檔單據</h3>
      <div id="closedOrdersGrid" class="orders-grid"></div>
    </div>

    <!-- 分頁 3: 營運報表 -->
    <div id="reportTab" class="content-section">
      <h3 style="margin-bottom: 14px;">📈 每日營業額與備料熱銷排行 (點擊卡片展開明細)</h3>
      <div id="dailyReportContainer"></div>
    </div>

    <!-- 分頁 4: 菜單開關 -->
    <div id="menuTab" class="content-section">
      <h3 style="margin-bottom: 14px;">🍱 餐點上架 / 售完即時控制</h3>
      <div id="adminMenuContainer" class="orders-grid"></div>
    </div>

    <!-- 分頁 5: 店務與桌位設定 -->
    <div id="settingsTab" class="content-section">
      <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap:20px;">
        <!-- 區塊 A: 動態店家基本資訊 -->
        <div style="background:white; padding:20px; border-radius:14px; box-shadow:0 2px 6px rgba(0,0,0,0.04);">
          <h3 style="margin-bottom:14px;">🏪 基本店家資訊設定</h3>
          <label style="font-size:13px; font-weight:bold;">店家名稱</label>
          <input type="text" id="storeNameInput" class="form-input" placeholder="例：劉家川味牛肉麵">
          <label style="font-size:13px; font-weight:bold;">聯絡電話</label>
          <input type="text" id="storePhoneInput" class="form-input" placeholder="例：06-2312729">
          <label style="font-size:13px; font-weight:bold;">店家地址</label>
          <input type="text" id="storeAddressInput" class="form-input" placeholder="例：台南市永康區中山北路131號">
          <label style="font-size:13px; font-weight:bold;">顧客須知 / 營業說明</label>
          <textarea id="storeNoticeInput" class="form-input" rows="3" placeholder="輸入顯示於前台的注意事項..."></textarea>
          <button class="btn btn-blue" style="width:100%; padding:12px;" onclick="saveStoreDetails()">💾 儲存店家基本資訊</button>
        </div>

        <!-- 區塊 B: 營業時間與店休控制 -->
        <div style="background:white; padding:20px; border-radius:14px; box-shadow:0 2px 6px rgba(0,0,0,0.04);">
          <h3 style="margin-bottom:14px;">⏰ 營業時間與臨時店休</h3>
          <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; background:#fff1f2; border-radius:10px; margin-bottom:16px;">
            <span style="font-weight:bold; color:#be123c;">🛑 緊急臨時店休開關</span>
            <input type="checkbox" id="manualCloseToggle" style="width:22px; height:22px;" onchange="toggleManualClose(this.checked)">
          </div>
          <label style="font-size:13px; font-weight:bold; display:block; margin-bottom:8px;">固定公休日</label>
          <div id="closedDaysWrapper" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; font-size:14px;">
            <label><input type="checkbox" value="1"> 週一</label>
            <label><input type="checkbox" value="2"> 週二</label>
            <label><input type="checkbox" value="3"> 週三</label>
            <label><input type="checkbox" value="4"> 週四</label>
            <label><input type="checkbox" value="5"> 週五</label>
            <label><input type="checkbox" value="6"> 週六</label>
            <label><input type="checkbox" value="0"> 週日</label>
          </div>
          <label style="font-size:13px; font-weight:bold;">第一段營業時間</label>
          <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px;">
            <input type="time" id="time1Start" class="form-input" style="margin:0;"> <span>至</span> <input type="time" id="time1End" class="form-input" style="margin:0;">
          </div>
          <label style="font-size:13px; font-weight:bold;">第二段營業時間</label>
          <div style="display:flex; gap:8px; align-items:center; margin-bottom:16px;">
            <input type="time" id="time2Start" class="form-input" style="margin:0;"> <span>至</span> <input type="time" id="time2End" class="form-input" style="margin:0;">
          </div>
          <button class="btn btn-green" style="width:100%; padding:12px;" onclick="saveStoreSettings()">💾 儲存營業時間設定</button>
        </div>

        <!-- 區塊 C: 動態桌位管理 -->
        <div style="background:white; padding:20px; border-radius:14px; box-shadow:0 2px 6px rgba(0,0,0,0.04);">
          <h3 style="margin-bottom:14px;">🪑 內用桌位對應管理</h3>
          <div style="display:flex; gap:8px; margin-bottom:12px;">
            <input type="text" id="newTableId" class="form-input" style="margin:0; flex:1;" placeholder="網址ID(留白自動編號)">
            <input type="text" id="newTableName" class="form-input" style="margin:0; flex:2;" placeholder="顯示桌名(例:二樓包廂)">
            <button class="btn btn-blue" onclick="addNewTable()">＋新增</button>
          </div>
          <div id="tableConfigList" style="display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto;"></div>
        </div>
      </div>
    </div>
  </div>
<!-- [Section 5: HTML 後台主介面與版面配置] End -->

    const firebaseConfig = {
      apiKey: "AIzaSyAm2HTW9fmse5lXnzrkMyEQQYZpAzQoHD4",
      authDomain: "liujia-689d7.firebaseapp.com",
      projectId: "liujia-689d7",

      messagingSenderId: "376230897719",

    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    let allOrders = [];
    let globalTableConfig = [];
    let globalTablesStatus = {};
    let globalStoreSettings = {};
    let confirmCallback = null;
    let currentEditingOrderId = null;
    let currentCheckoutCandidates = [];

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.innerText = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2600);
    }

      confirmCallback = cb;
      document.getElementById("confirmModal").style.display = "flex";

<!-- [Section 7: JS 登入與狀態管理] Start -->
  <script>
    async function verifyPin() {
      const input = document.getElementById("pinInput").value;
      if (!input) return showToast("請輸入密碼！");
      const btn = document.querySelector(".btn-login");
      btn.innerText = "驗證中...";

      try {
        const docRef = db.collection("system_settings").doc("admin");
        const docSnap = await docRef.get();
        let actualPin = "1111";
        if (!docSnap.exists) await docRef.set({ pin: "1111" });
        else actualPin = docSnap.data().pin;

        if (input === actualPin) {
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("adminDashboard").style.display = "block";
          showToast("登入成功！");
          startListeningOrders();
          startListeningMenu();
          startListeningTables();
          startListeningSettings();
        } else {
          showToast("密碼錯誤，請重新輸入！");
        }
      } catch (err) {
        showToast("連線失敗，請檢查網路！");
      } finally {
        btn.innerText = "登入系統";
      }
    }

    document.getElementById("pinInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") { event.preventDefault(); verifyPin(); }
    });

    function switchTab(tabId, el) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
      document.querySelectorAll(".content-section").forEach(s => s.classList.remove("active"));
      document.getElementById(tabId).classList.add("active");
    }

    function triggerReset() {
      showConfirm("確定要開始新的一天營業嗎？\n這將會把取號機歸零重置為 #100 號，並清空所有桌位狀態。", async (yes) => {
        if (!yes) return;
        try {
          await db.runTransaction(async (transaction) => {
            transaction.set(db.collection("system_status").doc("today"), { last_queue_number: 100, current_completed_number: 100 });
            let newTables = {};
            globalTableConfig.forEach(t => newTables[t.name] = "idle");
            transaction.set(db.collection("system_status").doc("tables"), newTables);
          });
          showToast("✅ 已成功歸零！目前的取號將從 #101 開始。");
        } catch (err) { showToast("歸零失敗！"); }
      });
    }

    function startListeningTables() {
      db.collection("system_status").doc("tables").onSnapshot(doc => {
        if (doc.exists) globalTablesStatus = doc.data() || {};
      });
    }

    function startListeningSettings() {
      db.collection("system_settings").doc("store_info").onSnapshot(doc => {
        if (doc.exists) {
          globalStoreSettings = doc.data();
          const sName = globalStoreSettings.store_name || "劉家川味牛肉麵";
          document.getElementById("adminHeaderTitle").innerText = `🍜 ${sName} - POS 後台`;
          document.getElementById("storeNameInput").value = globalStoreSettings.store_name || "";
          document.getElementById("storePhoneInput").value = globalStoreSettings.store_phone || "";
          document.getElementById("storeAddressInput").value = globalStoreSettings.store_address || "";
          document.getElementById("storeNoticeInput").value = globalStoreSettings.store_notice || "";

          document.getElementById("manualCloseToggle").checked = globalStoreSettings.manual_close || false;

          const days = globalStoreSettings.closed_days || [];
          document.querySelectorAll("#closedDaysWrapper input").forEach(cb => {
            cb.checked = days.includes(parseInt(cb.value));
          });

          const hours = globalStoreSettings.hours || ["11:00-14:00", "17:00-20:30"];
          if (hours[0]) { const [s, e] = hours[0].split('-'); document.getElementById("time1Start").value = s; document.getElementById("time1End").value = e; }
          if (hours[1]) { const [s, e] = hours[1].split('-'); document.getElementById("time2Start").value = s; document.getElementById("time2End").value = e; }
        } else {
          db.collection("system_settings").doc("store_info").set({
            store_name: "劉家川味牛肉麵", store_phone: "06-2312729", store_address: "台南市永康區中山北路131號",
            store_notice: "歡迎光臨！內用顧客請直接掃描桌號點餐。",
            manual_close: false, closed_days: [], hours: ["11:00-14:00", "17:00-20:30"]
          });
        }
      });

      db.collection("system_settings").doc("tables_config").onSnapshot(doc => {
        if (doc.exists) {
          globalTableConfig = doc.data().tables || [];
        } else {
          globalTableConfig = [1,2,3,4,5,6,7,8].map(i => ({ id: String(i), name: `第 ${i} 桌` }));
          db.collection("system_settings").doc("tables_config").set({ tables: globalTableConfig });
        }
        renderTableConfigList();
        updatePosTableSelect();
      });
    }

    async function saveStoreDetails() {
      const store_name = document.getElementById("storeNameInput").value.trim();
      const store_phone = document.getElementById("storePhoneInput").value.trim();
      const store_address = document.getElementById("storeAddressInput").value.trim();
      const store_notice = document.getElementById("storeNoticeInput").value.trim();
      if (!store_name) return showToast("店家名稱不可為空！");
      try {
        await db.collection("system_settings").doc("store_info").set({
          store_name, store_phone, store_address, store_notice
        }, { merge: true });
        showToast("✅ 店家基本資訊已儲存！");
      } catch (e) { showToast("儲存失敗，請檢查網路。"); }
    }

    async function toggleManualClose(isClosed) {
      try {
        await db.collection("system_settings").doc("store_info").update({ manual_close: isClosed });
        showToast(isClosed ? "🚫 已開啟臨時店休！" : "✅ 已恢復正常接單！");
      } catch (e) { showToast("更新失敗"); }
    }

    async function saveStoreSettings() {
      let closed_days = [];
      document.querySelectorAll("#closedDaysWrapper input:checked").forEach(cb => closed_days.push(parseInt(cb.value)));
      let hours = [];
      const t1s = document.getElementById("time1Start").value, t1e = document.getElementById("time1End").value;
      if (t1s && t1e) hours.push(`${t1s}-${t1e}`);
      const t2s = document.getElementById("time2Start").value, t2e = document.getElementById("time2End").value;
      if (t2s && t2e) hours.push(`${t2s}-${t2e}`);
      try {
        await db.collection("system_settings").doc("store_info").update({ closed_days, hours });
        showToast("✅ 營業時間設定已儲存");
      } catch (e) { showToast("儲存失敗"); }
    }

    function renderTableConfigList() {
      const list = document.getElementById("tableConfigList");
      list.innerHTML = globalTableConfig.map((t, idx) => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px;">
          <div><strong style="color:var(--primary);">ID: ${t.id}</strong> ➡️ <span style="font-weight:bold; margin-left:8px;">${t.name}</span></div>
          <button onclick="removeTableConfig(${idx})" class="btn btn-red">✕ 刪除</button>
        </div>
      `).join('');
    }

    async function addNewTable() {
      let id = document.getElementById("newTableId").value.trim();
      const name = document.getElementById("newTableName").value.trim();
      if (!name) return showToast("請填寫顯示名稱！");
      if (!id) {
        let nextNum = 1;
        while (globalTableConfig.find(t => t.id === String(nextNum))) { nextNum++; }
        id = String(nextNum);
      }
      if (name.includes("加單") || name.includes("併桌")) return showToast("名稱不可包含保留字 (加單/併桌)！");
      if (globalTableConfig.find(t => t.id === id)) return showToast("ID 已重複！");
      if (globalTableConfig.find(t => t.name === name)) return showToast("桌名已重複！");
      const newList = [...globalTableConfig, { id, name }];
      try {
        await db.collection("system_settings").doc("tables_config").update({ tables: newList });
        document.getElementById("newTableId").value = "";
        document.getElementById("newTableName").value = "";
        showToast("✅ 桌位新增成功！");
      } catch (e) { showToast("新增失敗"); }
    }

    function removeTableConfig(idx) {
      showConfirm("確定要刪除此桌位設定嗎？", async (yes) => {
        if (!yes) return;
        let newList = [...globalTableConfig];
        newList.splice(idx, 1);
        try {
          await db.collection("system_settings").doc("tables_config").update({ tables: newList });
          showToast("🗑️ 桌位已刪除");
        } catch (e) { showToast("刪除失敗"); }
      });
    }
  </script>
<!-- [Section 7: JS 登入與狀態管理] End -->

<!-- [Section 8: JS 訂單接單與叫號邏輯] Start -->
  <script>
    function extractCleanTableName(tableNumStr) {
      if (!tableNumStr || !tableNumStr.startsWith("內用 - ")) return null;
      return tableNumStr.replace("內用 - ", "").replace(" (加單)", "").replace(" (併桌)", "").trim();
    }

    function startListeningOrders() {
      db.collection("orders").orderBy("created_at", "desc").limit(300).onSnapshot(snap => {
        allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAllOrderSections();
        renderDailyReports();
      });
    }

    function renderAllOrderSections() {
      // 1. 廚房待製作：status 為 pending (不論是否已先付款，都留在廚房直到出餐)
      const pending = allOrders
        .filter(o => o.status === "pending")
        .sort((a,b) => (a.queue_number||0) - (b.queue_number||0));

      // 2. 已出餐・用餐待結帳：status 為 completed 且「尚未付款 (!o.is_paid)」
      const diningUnpaid = allOrders
        .filter(o => o.status === "completed" && !o.is_paid)
        .sort((a,b) => (a.queue_number||0) - (b.queue_number||0));

      // 3. 今日已結帳歷史：已出餐且已付款 (status === "completed" && o.is_paid)，相容舊版 closed
      const historyPaid = allOrders
        .filter(o => (o.status === "completed" && o.is_paid) || o.status === "closed")
        .slice(0, 80);

      document.getElementById("pendingOrdersGrid").innerHTML = pending.length
        ? pending.map(o => buildOrderCardHTML(o, "pending")).join('')
        : `<p style="color:#94a3b8;">目前無待製作餐點</p>`;

      document.getElementById("completedOrdersGrid").innerHTML = diningUnpaid.length
        ? diningUnpaid.map(o => buildOrderCardHTML(o, "completed")).join('')
        : `<p style="color:#94a3b8;">目前無用餐待結帳單據</p>`;

      document.getElementById("closedOrdersGrid").innerHTML = historyPaid.length
        ? historyPaid.map(o => buildOrderCardHTML(o, "history")).join('')
        : `<p style="color:#94a3b8;">尚無已結帳歷史紀錄</p>`;
    }

    function buildOrderCardHTML(ord, stage) {
      const itemsHtml = (ord.items || []).map(i => `
        <div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed #f1f5f9; font-size:14px;">
          <span><strong>${i.name}</strong> ${i.spec ? `<small style="color:#64748b;">(${i.spec})</small>` : ''} x${i.qty}</span>
          <span>$${i.subtotal}</span>
        </div>
      `).join('');

      const paidTag = ord.is_paid
        ? `<span style="background:#dcfce7; color:#166534; padding:3px 8px; border-radius:6px; font-size:12px; font-weight:bold;">✅ 已付款</span>`
        : `<span style="background:#fee2e2; color:#991b1b; padding:3px 8px; border-radius:6px; font-size:12px; font-weight:bold;">未付款</span>`;

      let actionBtns = "";
      if (stage === "pending") {
        actionBtns = `
          <button class="btn btn-blue" style="flex:1;" onclick="markOrderCompleted('${ord.id}', ${ord.queue_number}, ${!!ord.is_paid}, '${ord.table_number}')">🔔 出餐完畢</button>
          ${!ord.is_paid ? `<button class="btn btn-green" style="flex:1;" onclick="openSmartCheckout('${ord.id}')">💰 先行結帳</button>` : ''}
          <button class="btn btn-gray" onclick="openChangeTableModal('${ord.id}')">換桌</button>
          <button class="btn btn-red" onclick="cancelOrder('${ord.id}', '${ord.table_number}')">作廢</button>
        `;
      } else if (stage === "completed") {
        actionBtns = `
          <button class="btn btn-green" style="flex:1;" onclick="openSmartCheckout('${ord.id}')">💰 結帳清桌</button>
          <button class="btn btn-gray" onclick="openChangeTableModal('${ord.id}')">換桌</button>
          <button class="btn btn-red" onclick="cancelOrder('${ord.id}', '${ord.table_number}')">作廢</button>
        `;
      }

      return `
        <div class="order-card ${stage} ${ord.is_paid ? 'paid' : ''}">
          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
              <strong style="font-size:19px; color:var(--primary);">#${ord.queue_number}</strong>
              ${paidTag}
            </div>
            <div style="font-weight:bold; font-size:15px; margin-bottom:8px; color:#334155;">
              📍 ${ord.table_number} ${ord.customer_name ? `(${ord.customer_name})` : ''}
            </div>
            <div style="margin-bottom:10px;">${itemsHtml}</div>
            ${ord.note ? `<div style="background:#fef3c7; color:#92400e; padding:6px 8px; border-radius:6px; font-size:12px; margin-bottom:8px;">備註：${ord.note}</div>` : ''}
          </div>
          <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <span style="font-size:13px; color:#64748b;">單筆金額</span>
              <strong style="font-size:18px; color:#0f172a;">$${ord.total_amount}</strong>
            </div>
            ${actionBtns ? `<div style="display:flex; flex-wrap:wrap; gap:6px;">${actionBtns}</div>` : ''}
          </div>
        </div>
      `;
    }

    // 出餐完畢：若已先付款，出餐後自動進入歷史紀錄並檢查清桌；若未付款則移至「用餐待結帳區」
    async function markOrderCompleted(orderId, queueNum, isPaid, tableNumStr) {
      const cleanTable = extractCleanTableName(tableNumStr);
      try {
        await db.collection("system_status").doc("today").set({ current_completed_number: queueNum }, { merge: true });
        await db.collection("orders").doc(orderId).update({ status: "completed" });
        if (isPaid) {
          await checkAndReleaseTableIfEmpty(cleanTable, [orderId]);
          showToast(`✅ #${queueNum} 已出餐完畢並移入歷史紀錄！`);
        } else {
          showToast(`🔔 #${queueNum} 已出餐，移至用餐待結帳區！`);
        }
      } catch (e) { showToast("操作失敗"); }
    }

    // 檢查該桌是否還有「未完成或未結帳」的單據，若無則自動清桌為 idle
    async function checkAndReleaseTableIfEmpty(cleanTable, justFinishedOrderIds = []) {
      if (!cleanTable) return;
      const remainingActive = allOrders.filter(o => {
        if (justFinishedOrderIds.includes(o.id)) return false;
        if (o.status === "cancelled" || o.status === "closed") return false;
        // 只要是還沒出餐 (pending)，或是已出餐但還沒付錢 (completed && !is_paid)，都代表這桌還有人在用
        const stillActive = (o.status === "pending") || (o.status === "completed" && !o.is_paid);
        if (!stillActive) return false;
        return extractCleanTableName(o.table_number) === cleanTable;
      });
      if (remainingActive.length === 0) {
        await db.collection("system_status").doc("tables").set({ [cleanTable]: "idle" }, { merge: true });
      }
    }

    // 方案 C：智慧勾選結帳彈窗
    window.openSmartCheckout = function(triggerOrderId) {
      const targetOrd = allOrders.find(o => o.id === triggerOrderId);
      if (!targetOrd) return;

      const cleanTable = extractCleanTableName(targetOrd.table_number);
      if (!cleanTable) {
        currentCheckoutCandidates = [targetOrd];
      } else {
        currentCheckoutCandidates = allOrders.filter(o =>
          (o.status === "pending" || o.status === "completed") &&
          !o.is_paid &&
          extractCleanTableName(o.table_number) === cleanTable
        );
      }

      const isTriggerStranger = String(targetOrd.table_number).includes("(併桌)");
      document.getElementById("checkoutModalTitle").innerText = cleanTable ? `💰 ${cleanTable} - 勾選結帳` : `💰 外帶結帳 (#${targetOrd.queue_number})`;

      const listEl = document.getElementById("checkoutOrdersList");
      listEl.innerHTML = currentCheckoutCandidates.map(o => {
        const isStranger = String(o.table_number).includes("(併桌)");
        const defaultChecked = isTriggerStranger ? (o.id === triggerOrderId) : (!isStranger || o.id === triggerOrderId);
        return `
          <label style="display:flex; justify-content:space-between; align-items:center; padding:10px; border:1px solid #e2e8f0; border-radius:8px; margin-bottom:8px; cursor:pointer;">
            <div style="display:flex; align-items:center; gap:10px;">
              <input type="checkbox" class="checkout-cb" value="${o.id}" data-amount="${o.total_amount}" ${defaultChecked ? 'checked' : ''} onchange="recalcCheckoutModalTotal()" style="width:18px; height:18px;">
              <div>
                <strong>#${o.queue_number}</strong> <span style="font-size:13px; color:#475569;">${o.table_number}</span>
                <div style="font-size:12px; color:#64748b;">${(o.items||[]).map(i => `${i.name}x${i.qty}`).join(', ')}</div>
              </div>
            </div>
            <strong style="color:var(--primary);">$${o.total_amount}</strong>
          </label>
        `;
      }).join('');

      recalcCheckoutModalTotal();
      document.getElementById("checkoutModal").style.display = "flex";
    };

    window.recalcCheckoutModalTotal = function() {
      let sum = 0;
      document.querySelectorAll(".checkout-cb:checked").forEach(cb => {
        sum += Number(cb.getAttribute("data-amount") || 0);
      });
      document.getElementById("checkoutSelectedTotal").innerText = `$${sum}`;
    };

    window.closeCheckoutModal = function() {
      document.getElementById("checkoutModal").style.display = "none";
    };

    window.confirmBatchCheckout = async function() {
      const checkedIds = Array.from(document.querySelectorAll(".checkout-cb:checked")).map(cb => cb.value);
      if (!checkedIds.length) return showToast("請至少勾選一筆單據！");

      try {
        const batch = db.batch();
        let cleanTable = null;
        const fullyFinishedIds = [];

        checkedIds.forEach(id => {
          const ord = allOrders.find(o => o.id === id);
          if (!ord) return;
          if (!cleanTable) cleanTable = extractCleanTableName(ord.table_number);
          const ref = db.collection("orders").doc(id);
          // 標記為已付款；若該單原本已經是 completed (已出餐)，標記 is_paid: true 後就會自動進入歷史紀錄！
          batch.update(ref, { is_paid: true });
          if (ord.status === "completed") {
            fullyFinishedIds.push(id);
          }
        });

        await batch.commit();
        if (cleanTable && fullyFinishedIds.length > 0) {
          await checkAndReleaseTableIfEmpty(cleanTable, fullyFinishedIds);
        }
        closeCheckoutModal();
        showToast("✅ 收款結帳完成！");
      } catch (e) { showToast("結帳失敗"); }
    };

    function cancelOrder(orderId, tableNumStr) {
      showConfirm("確定要作廢此張訂單嗎？", async (yes) => {
        if (!yes) return;
        const cleanTable = extractCleanTableName(tableNumStr);
        try {
          await db.collection("orders").doc(orderId).update({ status: "cancelled" });
          await checkAndReleaseTableIfEmpty(cleanTable, [orderId]);
          showToast("🗑️ 訂單已作廢");
        } catch (e) { showToast("作廢失敗"); }
      });
    }

    function updatePosTableSelect() {
      const sel = document.getElementById("posTableSelect");
      if (!sel) return;
      sel.innerHTML = `<option value="外帶顧客">🛍️ 外帶顧客</option>` +
        globalTableConfig.map(t => `<option value="內用 - ${t.name}">🪑 內用 - ${t.name}</option>`).join('');
    }

    window.openChangeTableModal = function(orderId) {
      currentEditingOrderId = orderId;
      document.getElementById("changeTableModal").style.display = "flex";
    };

    window.closeChangeTableModal = function() {
      document.getElementById("changeTableModal").style.display = "none";
    };

    window.confirmChangeTable = async function() {
      if (!currentEditingOrderId) return;
      const newTableStr = document.getElementById("posTableSelect").value;
      const ord = allOrders.find(o => o.id === currentEditingOrderId);
      const oldClean = ord ? extractCleanTableName(ord.table_number) : null;
      const newClean = extractCleanTableName(newTableStr);

      try {
        await db.collection("orders").doc(currentEditingOrderId).update({ table_number: newTableStr });
        if (newClean) {
          await db.collection("system_status").doc("tables").set({ [newClean]: "occupied" }, { merge: true });
        }
        if (oldClean && oldClean !== newClean) {
          await checkAndReleaseTableIfEmpty(oldClean, [currentEditingOrderId]);
        }
        closeChangeTableModal();
        showToast("✅ 換桌成功！");
      } catch (e) { showToast("換桌失敗"); }
    };

    // 每日營運報表與熱銷排行榜
    function renderDailyReports() {
      const container = document.getElementById("dailyReportContainer");
      const paidOrders = allOrders.filter(o => o.status === "closed" || o.is_paid);
      if (!paidOrders.length) {
        container.innerHTML = `<p style="color:#94a3b8;">目前尚無已結帳之營收資料</p>`;
        return;
      }

      const grouped = {};
      paidOrders.forEach(o => {
        const d = o.created_at && o.created_at.toDate ? o.created_at.toDate() : new Date();
        const dateKey = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        if (!grouped[dateKey]) grouped[dateKey] = { revenue: 0, count: 0, itemsMap: {} };
        grouped[dateKey].revenue += Number(o.total_amount || 0);
        grouped[dateKey].count += 1;
        (o.items || []).forEach(it => {
          grouped[dateKey].itemsMap[it.name] = (grouped[dateKey].itemsMap[it.name] || 0) + Number(it.qty || 1);
        });
      });

      const sortedDates = Object.keys(grouped).sort((a,b) => b.localeCompare(a));
      container.innerHTML = sortedDates.map((dateStr, idx) => {
        const data = grouped[dateStr];
        const sortedItems = Object.entries(data.itemsMap).sort((a,b) => b[1] - a[1]);
        const rankHtml = sortedItems.map(([name, qty], rIdx) => {
          const medal = rIdx === 0 ? "🥇" : rIdx === 1 ? "🥈" : rIdx === 2 ? "🥉" : `▪️`;
          return `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed #e2e8f0; font-size:14px;">
            <span>${medal} ${name}</span>
            <strong>共售出 ${qty} 份/顆</strong>
          </div>`;
        }).join('');

        return `
          <div style="background:white; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 2px 6px rgba(0,0,0,0.04);">
            <div onclick="document.getElementById('repDetail_${idx}').style.display = document.getElementById('repDetail_${idx}').style.display === 'none' ? 'block' : 'none'" style="display:flex; justify-content:space-between; align-items:center; cursor:pointer;">
              <div>
                <strong style="font-size:17px;">📅 ${dateStr}</strong>
                <span style="font-size:13px; color:#64748b; margin-left:10px;">完成 ${data.count} 單</span>
              </div>
              <strong style="font-size:20px; color:var(--green);">營業額 $${data.revenue} ▾</strong>
            </div>
            <div id="repDetail_${idx}" style="display:${idx === 0 ? 'block' : 'none'}; margin-top:12px; padding-top:12px; border-top:1px solid #f1f5f9;">
              <p style="font-size:13px; font-weight:bold; color:#c2410c; margin-bottom:6px;">🔥 當日熱銷排行榜 (備料參考)：</p>
              ${rankHtml}
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
<!-- [Section 8: JS 訂單接單與叫號邏輯] End -->

<!-- [Section 9: JS 菜單開關邏輯] Start -->
  <script>
    function startListeningMenu() {
      db.collection("menu_items").onSnapshot(snap => {
        const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const container = document.getElementById("adminMenuContainer");
        container.innerHTML = items.map(it => {
          const avail = it.is_available !== false;
          return `
            <div style="background:white; padding:14px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 5px rgba(0,0,0,0.04);">
              <div>
                <div style="font-size:12px; color:#64748b;">${it.category_name}</div>
                <strong style="font-size:16px;">${it.name}</strong>
              </div>
              <button onclick="toggleMenuItem('${it.id}', ${!avail})" class="btn ${avail ? 'btn-green' : 'btn-red'}">
                ${avail ? '🟢 供應中' : '🔴 已售完'}
              </button>
            </div>
          `;
        }).join('');
      });
    }

    async function toggleMenuItem(itemId, nextState) {
      try {
        await db.collection("menu_items").doc(itemId).update({ is_available: nextState });
        showToast(nextState ? "✅ 已恢復上架供應" : "🚫 已標記為售完");
      } catch (e) { showToast("更新失敗"); }
    }
  </script>
<!-- [Section 9: JS 菜單開關邏輯] End -->
</body>
